<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #0a0a0a; margin: 0; }
    form { background: #1a1a1a; padding: 2rem; border-radius: 8px; }
    input { padding: 0.5rem; margin: 0.5rem 0; width: 200px; display: block; }
    button { padding: 0.5rem 1rem; cursor: pointer; }
    #error { color: #ff4d4d; font-size: 0.9rem; }
  </style>
</head>
<body>
  <form id="loginForm">
    <h2>Enter Password</h2>
    <input type="password" id="password" placeholder="Password" required />
    <button type="submit">Login</button>
    <p id="error"></p>
  </form>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault()
      const password = document.getElementById('password').value
      const res = await fetch('/api/auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password })
      })
      if (res.ok) {
        window.location.href = '/'
      } else {
        document.getElementById('error').textContent = 'Wrong password'
      }
    })
  </script>
</body>
</html>
